# Separate workspace for the example contracts. It is excluded from the root
# workspace, so root builds, tests and CI never touch it.
[workspace]
resolver = "2"
members = [
  "crowdfund",
  "crowdfund_factory",
  "escrow",
  "escrow_factory",
  "platform_extras",
  "subscription",
  "ticketing",
  "ticketing_factory",
]

[workspace.dependencies]
soroban-sdk = "23.4.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
